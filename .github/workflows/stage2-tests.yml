name: Stage 2 tests
on:
  push:
    branches: [main]
    paths: ['voi_async/**', 'tests_stage2/**', 'pyproject.toml', '.github/workflows/stage2-tests.yml']
  pull_request:
    paths: ['voi_async/**', 'tests_stage2/**', 'pyproject.toml', '.github/workflows/stage2-tests.yml']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests_stage2 -v
      - run: python -m compileall -q voi_async tests_stage2
