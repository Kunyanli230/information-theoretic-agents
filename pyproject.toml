[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voi-async"
version = "0.1.0"
description = "Executable information-theoretic asynchronous model delegation"
readme = "README_STAGE2.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
local = ["torch>=2.2", "transformers>=4.45,<5"]

[project.scripts]
voi-async = "voi_async.__main__:main"

[tool.setuptools]
packages = ["voi_async"]
